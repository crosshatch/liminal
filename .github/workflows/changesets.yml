name: Changesets
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  changesets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.MADHATCHER_PAT }}
      - run: |
          git config user.name "madhatcher"
          git config user.email "144481279+madhatcher@users.noreply.github.com"
      - uses: ./.github/actions/checkout-liminal
      - uses: ./konfik/configure-environment
      - run: pnpm build
      - run: git config fetch.recurseSubmodules false
      - uses: changesets/action@v1
        with:
          setupGitUser: false
          version: bash -c "pnpm changeset version && pnpm format"
          publish: pnpm changeset publish
          commit: version packages
          title: version packages
          prDraft: create
        env:
          GITHUB_TOKEN: ${{ secrets.MADHATCHER_PAT }}
